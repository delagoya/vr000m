name: EngineSounds
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  EngineSounds:
    type: application
    platform: iOS
    sources: [EngineSounds]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.EngineSounds
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMotionUsageDescription: "Engine Sounds uses motion data to turn your movement into engine noise."
        INFOPLIST_KEY_CFBundleDisplayName: "Engine Sounds"
